<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCOMPTEC - Redefinir senha</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100">

    <main class="min-h-screen flex items-center justify-center px-4 py-8">

        <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 sm:p-8">

            <div class="mb-8">
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">
                    Redefinir senha
                </h1>

                <p class="text-gray-500 mt-2">
                    Digite sua nova senha para acessar sua conta.
                </p>
            </div>

            <form id="formRedefinirSenha" class="space-y-5">

                <div>
                    <label for="novaSenha"
                           class="block text-sm font-medium text-gray-700 mb-2">
                        Nova senha
                    </label>

                    <input
                        type="password"
                        id="novaSenha"
                        required
                        minlength="6"
                        placeholder="Digite sua nova senha"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-green-600
                               focus:border-transparent">
                </div>

                <div>
                    <label for="confirmarSenha"
                           class="block text-sm font-medium text-gray-700 mb-2">
                        Confirmar nova senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        required
                        minlength="6"
                        placeholder="Digite a senha novamente"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-green-600
                               focus:border-transparent">
                </div>

                <button
                    type="submit"
                    class="w-full px-6 py-3 rounded-lg
                           bg-green-700 text-white font-semibold
                           hover:bg-green-800 transition">
                    Redefinir senha
                </button>

                <div class="text-center pt-2">
                    <a href="index.html"
                       class="text-sm text-green-700 hover:underline">
                        Voltar para o login
                    </a>
                </div>

            </form>

        </div>

    </main>

    <script src="js/config.js"></script>
    <script src="js/redefinir-senha.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCOMPTEC - Máquinas</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100">

    <div class="flex min-h-screen">

        <!-- MENU LATERAL -->
        <aside class="w-64 bg-[#07130f] text-white hidden md:flex flex-col">

            <div class="p-6 border-b border-white/10">

                <h1 class="text-2xl font-bold">
                    SCOMPTEC
                </h1>

                <p class="text-sm text-gray-400 mt-1">
                    Monitoramento industrial
                </p>

            </div>

            <nav id="menuPrincipal" class="space-y-2">

                <a href="home.html" class="block px-4 py-3 rounded-lg
                  bg-green-900 text-white">
                    Máquinas
                </a>

                <a href="cadastro-empresa.html" class="link-administrativo block px-4 py-3 rounded-lg
                  text-gray-300
                  hover:bg-gray-800
                  hover:text-white transition">
                    Cadastrar empresa
                </a>

                <a href="cadastro-maquina.html" class="link-administrativo block px-4 py-3 rounded-lg
                  text-gray-300
                  hover:bg-gray-800
                  hover:text-white transition">
                    Cadastrar máquina
                </a>

                <a href="cadastro-usuario.html" class="link-administrativo block px-4 py-3 rounded-lg
                  text-gray-300
                  hover:bg-gray-800
                  hover:text-white transition">
                    Cadastrar usuário
                </a>

                <a href="#" class="block px-4 py-3 rounded-lg
                  text-gray-300
                  hover:bg-gray-800
                  hover:text-white transition">
                    Configurações
                </a>

            </nav>

            <div class="mt-auto p-4 border-t border-white/10">

                <button onclick="sair()" class="w-full px-4 py-3 rounded-lg
                   hover:bg-red-500/20
                   text-left transition">
                    Sair
                </button>

            </div>

        </aside>

        <div id="menuMobile" class="hidden fixed inset-0 z-50 bg-black/50 md:hidden">

            <aside class="w-72 max-w-[85vw] h-full bg-[#07130f] text-white flex flex-col">

                <div class="p-6 border-b border-white/10">
                    <h1 class="text-2xl font-bold">SCOMPTEC</h1>
                    <p class="text-sm text-gray-400 mt-1">
                        Monitoramento industrial
                    </p>
                </div>

                <nav id="menuPrincipalMobile" class="p-4 space-y-2">
                    <!-- vamos preencher depois -->
                </nav>

                <div class="mt-auto p-4 border-t border-white/10">
                    <button onclick="sair()"
                        class="w-full px-4 py-3 rounded-lg hover:bg-red-500/20 text-left transition">
                        Sair
                    </button>
                </div>

            </aside>
        </div>

        <!-- CONTEÚDO -->
        <main class="flex-1 min-w-0">

            <!-- HEADER -->
            <header class="bg-white border-b px-4 sm:px-6 lg:px-10 py-5">

                <button id="abrirMenu" class="md:hidden mb-4 px-3 py-2 rounded-lg bg-[#07130f] text-white">
                    ☰
                </button>

                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">

                    <div>
                        <h2 class="text-2xl font-bold text-gray-900">
                            Máquinas
                        </h2>

                        <p class="text-gray-500 mt-1">
                            Acompanhe as máquinas monitoradas pela SCOMPTEC.
                        </p>
                    </div>

                    <div>
                        <p id="nomeUsuario" class="font-semibold text-gray-800">
                            Usuário
                        </p>

                        <p id="tipoUsuario" class="text-sm text-gray-500">
                            Tipo de acesso
                        </p>
                    </div>

                </div>

            </header>


            <!-- ÁREA DAS MÁQUINAS -->
            <section class="p-4 sm:p-6 lg:p-10">

                <div id="listaMaquinas" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">

                    <!-- Os cards das máquinas entrarão aqui -->

                </div>

            </section>

        </main>

    </div>


    <script src="js/config.js"></script>
<script src="js/home.js"></script>

    <script>
        async function sair() {

            try {
                await fetch(`${API_URL}/api/usuarios/logout`, {
                    method: "POST",
                    credentials: "include"
                });

            } catch (erro) {
                console.error("Erro ao fazer logout:", erro);

            } finally {
                localStorage.removeItem("usuarioLogado");
                window.location.href = "index.html";
            }
        }
    </script>

</body>

</html>

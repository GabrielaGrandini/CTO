<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCOMPTEC - Cadastro de Máquina</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100">

    <main class="min-h-screen flex items-center justify-center px-4 py-8">

        <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-6 sm:p-8">

            <div class="mb-8">
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">
                    Cadastrar máquina
                </h1>

                <p class="text-gray-500 mt-2">
                    Cadastre uma máquina e associe-a a uma empresa.
                </p>
            </div>


            <form id="formMaquina" class="space-y-5">

                <!-- EMPRESA -->

                <div>
                    <label for="empresa" class="block text-sm font-medium text-gray-700 mb-2">
                        Empresa
                    </label>

                    <select id="empresa" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                   focus:outline-none focus:ring-2 focus:ring-green-600">

                        <option value="">
                            Carregando empresas...
                        </option>

                    </select>
                </div>


                <!-- NOME -->

                <div>
                    <label for="nome" class="block text-sm font-medium text-gray-700 mb-2">
                        Nome da máquina
                    </label>

                    <input type="text" id="nome" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                  focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>


                <!-- MARCA -->

                <div>
                    <label for="marca" class="block text-sm font-medium text-gray-700 mb-2">
                        Marca
                    </label>

                    <input type="text" id="marca" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                  focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>


                <!-- MODELO -->

                <div>
                    <label for="modelo" class="block text-sm font-medium text-gray-700 mb-2">
                        Modelo
                    </label>

                    <input type="text" id="modelo" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                  focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>


                <!-- SETOR -->

                <div>
                    <label for="setor" class="block text-sm font-medium text-gray-700 mb-2">
                        Setor
                    </label>

                    <input type="text" id="setor" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                  focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>


                <!-- LINHA -->

                <div>
                    <label for="linha" class="block text-sm font-medium text-gray-700 mb-2">
                        Linha
                    </label>

                    <input type="text" id="linha" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                  focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>


                <!-- IDENTIFICAÇÃO -->

                <div>
                    <label for="identificacao" class="block text-sm font-medium text-gray-700 mb-2">
                        Identificação
                    </label>

                    <input type="text" id="identificacao" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                  focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>


                <!-- BOTÕES -->

                <div class="flex flex-col sm:flex-row gap-3 pt-4">

                    <a href="home.html" class="w-full sm:w-auto px-6 py-3 rounded-lg
                              border border-gray-300 text-center text-gray-700
                              hover:bg-gray-50 transition">
                        Cancelar
                    </a>

                    <button type="submit" class="w-full sm:flex-1 px-6 py-3 rounded-lg
                                   bg-green-700 text-white font-semibold
                                   hover:bg-green-800 transition">
                        Cadastrar máquina
                    </button>

                </div>

            </form>

        </div>

    </main>


    <<script src="js/config.js"></script>
<script src="js/maquina.js"></script>

</body>

</html>

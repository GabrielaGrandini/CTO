<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCOMPTEC - Cadastro de Usuário</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100">

    <main class="min-h-screen flex items-center justify-center px-4 py-8">

        <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-6 sm:p-8">

            <div class="mb-8">
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">
                    Cadastrar usuário
                </h1>

                <p class="text-gray-500 mt-2">
                    Cadastre um usuário e associe-o a uma empresa.
                </p>
            </div>

            <form id="formUsuario" class="space-y-5">

                <div>
                    <label for="nome" class="block text-sm font-medium text-gray-700 mb-2">
                        Nome
                    </label>

                    <input type="text" id="nome" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                  focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        E-mail
                    </label>

                    <input type="email" id="email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                  focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>

                <div>
                    <label for="senha" class="block text-sm font-medium text-gray-700 mb-2">
                        Senha
                    </label>

                    <input type="password" id="senha" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                  focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>

                <div>
                    <label for="tipo" class="block text-sm font-medium text-gray-700 mb-2">
                        Tipo de usuário
                    </label>

                    <select id="tipo" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                   focus:outline-none focus:ring-2 focus:ring-green-600">

                        <option value="CLIENTE">
                            Cliente
                        </option>

                        <option value="SCOMPTEC">
                            SCOMPTEC
                        </option>

                    </select>
                </div>

                <div id="empresaContainer">

                    <label for="empresa" class="block text-sm font-medium text-gray-700 mb-2">
                        Empresa
                    </label>

                    <select id="empresa" class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                   focus:outline-none focus:ring-2 focus:ring-green-600">

                        <option value="">
                            Carregando empresas...
                        </option>

                    </select>

                </div>

                <div class="flex flex-col sm:flex-row gap-3 pt-4">

                    <a href="home.html" class="w-full sm:w-auto px-6 py-3 rounded-lg
                              border border-gray-300 text-center text-gray-700
                              hover:bg-gray-50 transition">
                        Cancelar
                    </a>

                    <button type="submit" class="w-full sm:flex-1 px-6 py-3 rounded-lg
                                   bg-green-700 text-white font-semibold
                                   hover:bg-green-800 transition">
                        Cadastrar usuário
                    </button>

                </div>

            </form>

        </div>

    </main>

    <script src="js/config.js"></script>
    <script src="js/usuario.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCOMPTEC - Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#07130f]">
    <div class="min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-6 sm:p-8">

        <h1 class="text-3xl font-bold text-center text-gray-900">
            SCOMPTEC
        </h1>

        <p class="text-center text-gray-500 mt-2">
            Acesse sua conta
        </p>

        <form class="mt-8 space-y-5">

    <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
            E-mail
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="seuemail@gmail.com"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-green-600
                   focus:border-transparent"
        >
    </div>

    <div>
        <label for="senha" class="block text-sm font-medium text-gray-700 mb-2">
            Senha
        </label>

        <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-green-600
                   focus:border-transparent"
        >
    </div>

    <div class="text-right">
        <a href="recuperar-senha.html"
           class="text-sm text-green-700 hover:underline">
            Esqueceu a senha?
        </a>
    </div>

    <button
        type="submit"
        class="w-full py-3 px-4 bg-green-700 text-white font-semibold
               rounded-lg hover:bg-green-800 transition">
        Entrar
    </button>

</form>

    </div>

</div>
<script src="js/config.js"></script>
<script src="js/login.js"></script>
</body>

</html>
